version: '3.9'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: gunicorn star_burger.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ../:/app
      - static_volume:/static
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:12-alpine
    environment:
      POSTGRES_USER: star_burger
      POSTGRES_PASSWORD: star_burger_password
      POSTGRES_DB: star_burger_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/static
    ports:
      - "80:80"
    depends_on:
      - web


volumes:
  postgres_data:
  static_volume:
