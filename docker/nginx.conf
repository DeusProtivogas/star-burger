worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # HTTP блок для перенаправления всех запросов на HTTPS
    server {
        listen 80;  # Обработка запросов на порту 80 (HTTP)
        server_name star-burg-example-depl.work.gd;

        # Перенаправление всех запросов с HTTP на HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS блок для обработки безопасных соединений
    server {
        listen 443 ssl;  # Обработка запросов на порту 443 (HTTPS)
        server_name star-burg-example-depl.work.gd;

        # Пути к SSL-сертификатам, которые вы получили через Certbot
        ssl_certificate /etc/letsencrypt/live/star-burg-example-depl.work.gd/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/star-burg-example-depl.work.gd/privkey.pem;

        # Настройка для безопасного соединения
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location /static/ {
            # Настройка для статических файлов
            alias /static/;
        }

        location / {
            # Прокси-передача запросов на Gunicorn (Django)
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
