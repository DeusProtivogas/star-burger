worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream django_web {
        server web:8000;
    }

    server {
        listen 80;
        server_name star-burg-example-depl.work.gd www.star-burg-example-depl.work.gd;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name star-burg-example-depl.work.gd www.star-burg-example-depl.work.gd;

        ssl_certificate /etc/letsencrypt/live/star-burg-example-depl.work.gd/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/star-burg-example-depl.work.gd/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:CHACHA20-POLY1305:AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

        location /static/ {
            alias /static/;
        }

        location / {
            proxy_pass http://django_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
